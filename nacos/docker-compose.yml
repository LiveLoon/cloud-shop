version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: cloud-shop-nacos-standalone
    environment:
      - MODE=standalone           # 单机模式启动
    ports:
      - "8848:8848"               # 映射HTTP端口
      - "9848:9848"               # 映射gRPC端口
    volumes:
      - ./nacos-data:/home/nacos/data       # 持久化数据目录
      - ./nacos-logs:/home/nacos/logs       # 持久化日志目录
    restart: unless-stopped
