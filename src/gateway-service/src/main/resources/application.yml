server:
  port: 8989   # 网关对外端口

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 服务发现地址
    gateway:
      discovery:
        locator:
          enabled: true                     # 开启基于服务发现的路由自动生成
          lower-case-service-id: true       # 服务名转为小写（例如 USER-SERVICE -> user-service）

# 可选：日志级别，方便调试路由匹配
logging:
  level:
    org.springframework.cloud.gateway: DEBUG